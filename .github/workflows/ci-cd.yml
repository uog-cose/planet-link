name: Youth Quest CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youth-quest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: youthquest
          POSTGRES_USER: youthquest
          POSTGRES_PASSWORD: youthquest_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U youthquest -d youthquest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: local
      DEBUG: "true"
      ENABLE_QUICK_LOGIN: "false"
      DB_ENGINE: postgres
      DB_NAME: youthquest
      DB_USER: youthquest
      DB_PASSWORD: youthquest_ci_password
      DB_HOST: localhost
      DB_PORT: 5432
      APP_DATA_DIR: /tmp/youthquest-data
      SEED_DEMO: "false"
      SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Type check
        working-directory: frontend
        run: npm run lint
      - name: Production build (quick login disabled)
        working-directory: frontend
        env:
          VITE_APP_ENV: prod
          VITE_ENABLE_QUICK_LOGIN: "false"
        run: |
          npm run build
          if grep -R -n "dev-login" dist/assets; then
            echo "Development quick-login code was included in the production bundle." >&2
            exit 1
          fi

  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy release to Droplet
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.production' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.sqlite3' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Deploy production stack
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && ./deploy.sh"
