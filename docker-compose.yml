services:
  backend:
    build: ./backend
    env_file: ./.env
    environment:
      APP_DATA_DIR: /app/data
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - youthquest_data:/app/data
      - youthquest_media:/app/media
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_ENV: ${APP_ENV:-local}
        VITE_APP_NAME: ${APP_NAME:-Youth Quest}
        VITE_API_URL: ${API_URL:-/api}
        VITE_ENABLE_PWA: ${ENABLE_PWA:-true}
        VITE_ENABLE_QUICK_LOGIN: ${ENABLE_QUICK_LOGIN:-true}
        VITE_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5174}
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    volumes:
      - youthquest_media:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  youthquest_data:
  youthquest_media:
