<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Youth Quest Media Gallery</title><style>body{font-family:system-ui;background:#f5f2e9;color:#17342c;margin:0;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.item{background:#fffdf7;border:1px solid #d9ddd5;border-radius:16px;padding:12px}.item img{width:100%;height:120px;object-fit:contain;background:#edf2ed;border-radius:10px}.item b{display:block;font-size:12px;margin-top:8px}.item small{color:#6c7d76}</style></head><body><h1>Youth Quest media gallery</h1><p>Reusable assets kept separate from the HTML/CSS/JS prototype.</p><h2>20 avatars</h2><div class="grid" id="avatars"></div><h2>Graphics</h2><div class="grid" id="graphics"></div><script>const A=['alex','ben','charlie','daniel','ethan','finley','george','henry','jack','logan'].map((x,i)=>`male-${String(i+1).padStart(2,'0')}-${x}.svg`).concat(['ava','bella','chloe','daisy','ella','freya','grace','holly','isabella','sophie'].map((x,i)=>`female-${String(i+1).padStart(2,'0')}-${x}.svg`));const G=['quest-explorer.svg','streak-flame.svg','community.svg','reaction.svg','memory.svg','type.svg','sequence.svg','visual.svg','drawing.svg','donut.svg','map-grid.svg','qr-demo.svg','../icons/quest-mark.svg'];function fill(id,arr,dir){document.getElementById(id).innerHTML=arr.map(f=>`<div class="item"><img src="${dir}/${f}"><b>${f}</b><small>Reusable asset</small></div>`).join('')}fill('avatars',A,'avatars');fill('graphics',G,'graphics');</script></body></html>
