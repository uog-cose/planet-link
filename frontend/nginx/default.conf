server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Django collectstatic output is shared read-only from the backend container.
  location ^~ /static/ {
    alias /var/www/static/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # User-uploaded images and media live in the persistent backend volume.
  # The same volume is mounted read-only in this container.
  location ^~ /media/ {
    alias /var/www/media/;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $request_filename =404;
  }

  location /django-admin/ {
    proxy_pass http://backend:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  # Django admin login and subsequent admin pages.
  location ^~ /admin/ {
    proxy_pass http://backend:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
